version: '3.8'

services:
  # Rizocare AI Platform App Service
  rizocare-ai-api:
    build:
      context: .
      dockerfile: Dockerfile.ai
    container_name: rizocare_ai_service
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_DEFAULT_MODEL=${OPENAI_DEFAULT_MODEL:-gpt-4.1-mini}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017/rizocare_ai_analytics
    depends_on:
      - qdrant
      - redis
      - mongo
    networks:
      - rizocare-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rizocare_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - rizocare-network

  # Redis Session Memory & Embedding Cache
  redis:
    image: redis:7-alpine
    container_name: rizocare_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    networks:
      - rizocare-network

  # MongoDB Analytics & Token Usage Store
  mongo:
    image: mongo:7.0
    container_name: rizocare_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - rizocare-network

networks:
  rizocare-network:
    driver: bridge

volumes:
  qdrant_storage:
  redis_data:
  mongo_data:
