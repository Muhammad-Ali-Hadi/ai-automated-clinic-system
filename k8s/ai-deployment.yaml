apiVersion: apps/v1
kind: Deployment
metadata:
  name: rizocare-ai-deployment
  namespace: rizocare-production
  labels:
    app: rizocare-ai
    tier: ai-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rizocare-ai
  template:
    metadata:
      labels:
        app: rizocare-ai
    spec:
      containers:
        - name: ai-service
          image: rizocare/ai-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ai-config
            - secretRef:
                name: ai-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rizocare-ai-hpa
  namespace: rizocare-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rizocare-ai-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rizocare-ai-service
  namespace: rizocare-production
spec:
  type: ClusterIP
  selector:
    app: rizocare-ai
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
